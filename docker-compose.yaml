version: "3.9"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    container_name: api
    depends_on:
      - elasticsearch
      - redis
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env

  worker:
    build:
      context: ./services/worker
    container_name: worker
    depends_on:
      - redis
      - elasticsearch
    env_file:
      - .env

volumes:
  es_data:
  pg_data: